name: CI

on:
  pull_request:
  push:
    branches: [develop] # main runs CI as the first job of deploy.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OpenAPI document is up to date
        run: |
          npm run openapi -w services/api
          git diff --exit-code docs/api/openapi.json
      - name: Migrations match the schema
        run: |
          npm run db:generate -w services/api
          if [ -n "$(git status --porcelain database/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit it."
            git status --porcelain database/migrations
            exit 1
          fi

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
